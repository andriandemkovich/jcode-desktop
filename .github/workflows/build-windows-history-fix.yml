name: Build Windows desktop history fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Checkout desktop
        uses: actions/checkout@v4
        with:
          path: jcode-desktop

      - name: Checkout patched Jcode runtime
        uses: actions/checkout@v4
        with:
          repository: andriandemkovich/jcode
          ref: fix/windows-desktop-history
          path: jcode
          submodules: recursive

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Format check patched transport
        shell: pwsh
        run: rustfmt --edition 2024 --check jcode/crates/jcode-transport/src/windows.rs

      - name: Test patched Windows transport
        shell: pwsh
        run: cargo test --manifest-path jcode/Cargo.toml -p jcode-transport -- socket_path_probe_works_without_a_tokio_runtime a_parked_reader_clone_does_not_block_the_writer

      - name: Test Desktop window controls
        shell: pwsh
        run: cargo test --manifest-path jcode-desktop/Cargo.toml -p jcode-desktop-ui -- tab_minimize_window_sits_beside_close_and_keeps_the_workspace tab_close_window_is_separate_from_new_session_and_dispatches_host_action

      # Every module and test the accounts work touches. `cargo test` filters
      # are substrings of the full test path, so the module prefixes cover the
      # unit tests and the named ones cover the cross-module UI tests. A module
      # path ends in `::` followed by a space, which YAML rejects in a plain
      # scalar, so this command is a block scalar.
      - name: Test Desktop accounts panel
        shell: pwsh
        run: >
          cargo test --manifest-path jcode-desktop/Cargo.toml -p jcode-desktop-ui --
          "accounts::tests::" "panel::account::tests::" "panel::usage::tests::"
          connected_accounts_paint_in_the_sidebar
          accounts_sidebar_groups_all_supported_states_and_refreshes
          accounts_oauth_history_renders_named_periods_and_unavailable_state
          accounts_fill_tab_with_mixed_quota_details
          accounts_scroll_independently_and_prioritize_active
          accounts_show_each_login_with_all_of_its_own_limits
          clicking_an_inactive_login_requests_the_account_switch

      - name: Build Windows package
        shell: pwsh
        env:
          VERSION: 0.3.1-historyfix.4
          JCODE_REPO: ${{ github.workspace }}/jcode
          TARGET: x86_64-pc-windows-msvc
        run: ./jcode-desktop/scripts/package-windows.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: jcode-desktop-windows-history-fix
          if-no-files-found: error
          retention-days: 3
          path: |
            jcode-desktop/dist/windows/Jcode-*.zip
            jcode-desktop/dist/windows/SHA256SUMS-windows
